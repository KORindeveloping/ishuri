services:
  - type: web
    name: tvet-mastery-pro-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: OLLAMA_HOST
        value: 0.0.0.0
      - key: OLLAMA_URL
        value: http://127.0.0.1:11434/api/chat
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
